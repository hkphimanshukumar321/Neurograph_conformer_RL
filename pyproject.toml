[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "neurograph-conformer-rl"
version = "0.1.0"
description = "Multi-level EEG-based neural language decoding: classification, retrieval, and generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NeuroGraph Team"},
]
keywords = [
    "EEG", "BCI", "imagined-speech", "inner-speech",
    "conformer", "graph-neural-network", "mamba",
    "brain-computer-interface", "neural-decoding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "lightning>=2.1.0",
    # EEG processing
    "mne>=1.6.0",
    "autoreject>=0.4.3",
    "meegkit>=0.1.7",
    # Graph neural networks
    "torch-geometric>=2.4.0",
    # Mamba / state space models
    "mamba-ssm>=1.2.0; sys_platform == 'linux'",
    # Signal processing
    "scipy>=1.11.0",
    "pywavelets>=1.5.0",
    # Data handling
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "h5py>=3.10.0",
    "pyarrow>=14.0.0",
    # NLP / text evaluation
    "transformers>=4.41.0",
    "sentence-transformers>=2.3.0",
    "evaluate>=0.4.0",
    "jiwer>=3.0.0",           # WER/CER
    "bert-score>=0.3.13",
    # Config and experiment management
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "wandb>=0.16.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    # Utilities
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "ipykernel>=6.27.0",
    "jupyterlab>=4.0.0",
]
deploy = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "onnxruntime-gpu>=1.16.0; sys_platform == 'linux'",
]

[project.scripts]
ng-scan = "scripts.scan_datasets:main"
ng-preprocess = "scripts.preprocess:main"
ng-train = "scripts.train:main"
ng-eval = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
