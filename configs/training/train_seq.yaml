# Stage 3: Sequence training (CTC + Cross-Entropy) for generation

stage: train_seq
description: >
  Sequence-level training for sentence generation and retrieval.
  Uses CTC loss (alignment-free) + autoregressive cross-entropy.
  Teacher forcing with scheduled sampling.

training:
  stage: 3
  batch_size: 16
  max_epochs: 100
  lr: 5.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_epochs: 5
  min_lr: 1.0e-6
  gradient_clip_val: 1.0
  early_stopping:
    enabled: true
    patience: 20
    monitor: val_semantic_similarity
    mode: max

  # Pretrained checkpoint (from Stage 2)
  pretrained:
    enabled: true
    checkpoint: null         # path to Stage 2 checkpoint
    freeze_encoder: false

  # Loss
  losses:
    ctc:
      enabled: true
      blank_id: 0
      weight: 0.3
    cross_entropy:
      enabled: true
      label_smoothing: 0.1
      weight: 1.0
    retrieval_contrastive:
      enabled: true
      type: infonce           # "infonce" or "triplet"
      margin: 0.2             # for triplet
      temperature: 0.07       # for infonce
      weight: 0.5

  # Teacher forcing schedule
  teacher_forcing:
    start_ratio: 1.0
    end_ratio: 0.5
    decay_epochs: 50
    schedule: linear          # "linear" or "exponential"

  # Beam search (for evaluation during training)
  beam_search:
    beam_size: 5
    length_penalty: 0.6
    max_length: 50
