# ──────────────────────────────────────────────────────────────
# base.yaml — Global defaults inherited by all experiments
# ──────────────────────────────────────────────────────────────

seed: 42
device: auto
precision: fp32
num_workers: 4
pin_memory: true

# ──── Project ────
project:
  name: neurograph-conformer-rl
  root: .
  data_dir: data
  results_dir: results
  experiments_dir: experiments

# ──── Preprocessing defaults ────
preprocessing:
  target_srate: 250           # Hz — all datasets resampled to this
  bandpass_low: 0.5           # Hz
  bandpass_high: 100.0        # Hz
  notch_freq: null            # dataset-dependent (50 or 60 Hz)
  filter_method: fir          # "fir" or "iir"
  epoch_tmin: 0.0             # seconds relative to event onset
  epoch_tmax: 2.0             # seconds
  baseline_tmin: -0.5         # seconds (for baseline correction)
  baseline_tmax: 0.0          # seconds
  amplitude_threshold: 100.0  # µV — reject epochs exceeding this
  artifact_method: ica        # "ica", "asr", "threshold"
  ica_n_components: null      # null = 0.999 variance explained
  ica_max_remove: 3           # max ICA components to remove
  normalization: zscore       # "zscore", "minmax", "robust"
  norm_scope: per_session     # "per_session", "per_trial"
  reference: car              # "car" (common average reference)

# ──── Feature extraction defaults ────
features:
  method: cwt                 # "cwt", "filterbank", "stft", "raw"
  # CWT
  cwt_freqs_min: 1
  cwt_freqs_max: 100
  cwt_freqs_step: 1
  cwt_n_cycles_mode: adaptive # "adaptive" (freq/2) or "fixed"
  cwt_n_cycles_fixed: 7
  cwt_time_downsample: 4      # downsample temporal axis by this factor
  # Filter bank
  filterbank_bands:
    delta: [0.5, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta: [13, 30]
    low_gamma: [30, 50]
    high_gamma: [50, 100]
  filterbank_window_s: 0.5    # seconds
  filterbank_stride_s: 0.125  # seconds (75% overlap)
  # Channel strategy
  channel_strategy: region_pooling  # "common_intersection", "region_pooling", "graph"
  n_regions: 9

# ──── Training defaults ────
training:
  batch_size: 32
  max_epochs: 200
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine_warmup
  warmup_epochs: 10
  min_lr: 1.0e-6
  gradient_clip_val: 1.0
  early_stopping:
    enabled: true
    patience: 30
    monitor: val_balanced_accuracy
    mode: max
  label_smoothing: 0.1
  # Loss weights (multi-task) — Phase 1: classification + contrastive
  loss_weights:
    cls: 1.0         # primary objective
    contrast: 0.3    # SupCon on retrieval embeddings (direct encoder reward)
    ctc: 0.0         # OFF until Phase 2 (decoder not trained)
    gen: 0.0         # OFF until Phase 2
    retrieval: 0.5   # reserved for InfoNCE with text encoder
    rl: 0.0          # OFF until Phase 3 (SCST fine-tuning)

# ──── Evaluation defaults ────
evaluation:
  metrics:
    - balanced_accuracy
    - macro_f1
    - top_k_accuracy
    - confusion_matrix
  top_k: [3, 5]
  statistical_test: wilcoxon
  confidence_level: 0.95
  n_seeds: 5

# ──── Logging ────
logging:
  level: INFO
  log_dir: logs
  wandb:
    enabled: true
    project: neurograph-conformer-rl
    entity: null
    tags: []
